<script>
(function () {
  "use strict";

  const TAU = Math.PI * 2;

  // ---------- 调色板（实验编程 / 生成艺术风格）----------
  const PALETTE = ["#5b86ff", "#9b7bff", "#4fd6e0", "#7aa8ff"]; // 蓝 / 紫 / 青 / 蓝青
  const GOLD = "#e6c277";                                         // 少量金

  // ---------- 可调参数 ----------
  const params = {
    gameDuration: 60,      // 游戏时长（秒）
    maxParticles: 25,      // 最大彩色粒子数
    spawnInterval: 400,    // 粒子生成间隔（ms）
    ringRadius: 42,        // 圆环半径（也是捕捉半径）
    ringGlow: 28,          // 光晕强度
    particleSpeed: 42,     // 流场速度（px/s）
    scorePerParticle: 1,   // 每粒子得分
    ringSmoothing: 0.35,   // 圆环跟随鼠标的平滑系数
    showTrails: false,     // 整体运动拖影
    blackSpawnInterval: 2200, // 黑色故障粒子生成间隔(ms)
    maxBlack: 3,           // 最大黑色粒子数
    patternBrightness: 1.0,// 纹样亮度系数
    patternSpeed: 0.04,    // 纹样缓慢自转速度
    doubleDuration: 5,     // 双倍得分状态持续时长(秒)
  };

  const GROW_TARGET = 40;   // 收集多少粒子后纹样完全展开
  const COMBO_WINDOW = 2.5; // 连击保持窗口（秒）

  const sliderConfig = [
    { key: "gameDuration",   label: "游戏时长(秒)", min: 10, max: 300, step: 5 },
    { key: "maxParticles",   label: "最大粒子数",   min: 1,  max: 200, step: 1 },
    { key: "spawnInterval",  label: "生成间隔(ms)", min: 50, max: 2000, step: 50 },
    { key: "ringRadius",     label: "圆环半径",     min: 10, max: 150, step: 1 },
    { key: "ringGlow",       label: "光晕强度",     min: 0,  max: 60,  step: 1 },
    { key: "particleSpeed",  label: "流场速度",     min: 0,  max: 200, step: 5 },
    { key: "scorePerParticle", label: "每粒子得分", min: 1,  max: 50,  step: 1 },
    { key: "ringSmoothing",  label: "跟随平滑",     min: 0.05, max: 1, step: 0.05 },
    { key: "blackSpawnInterval", label: "黑粒子间隔(ms)", min: 500, max: 6000, step: 100 },
    { key: "maxBlack",       label: "最大黑粒子数", min: 0,  max: 10, step: 1 },
    { key: "patternBrightness", label: "纹样亮度",   min: 0.2, max: 2, step: 0.1 },
    { key: "patternSpeed",   label: "纹样转速",     min: 0,  max: 0.2, step: 0.01 },
    { key: "doubleDuration", label: "双倍时长(秒)", min: 1,  max: 20,  step: 1 },
  ];

  // ---------- 画布与状态 ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("game-wrap");

  let W = 0, H = 0, DPR = 1, bgGrad = null;
  // 纹样离屏画布
  let patternCanvas = document.createElement("canvas");
  let pctx = patternCanvas.getContext("2d");
  let P = 0; // 纹样画布边长

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = wrap.clientWidth;
    H = wrap.clientHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    bgGrad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.75);
    bgGrad.addColorStop(0, "#0c1530");
    bgGrad.addColorStop(1, "#05070f");

    P = Math.min(W, H);
    patternCanvas.width = P;
    patternCanvas.height = P;
    generatePattern();
  }
  window.addEventListener("resize", resize);

  const state = {
    mode: "idle",        // idle | running | over
    score: 0,
    collisions: 0,
    blackHits: 0,
    lives: 3,
    shake: 0,
    flashAlpha: 0,
    combo: 0,
    comboTimer: 0,
    maxCombo: 0,       // 本局最高连击
    comboTier: 0,      // 连击等级（每 5 连击一级，用于升级音效）
    startTime: 0,
    elapsed: 0,
    timeLeft: params.gameDuration,
    particles: [],
    effects: [],         // 涟漪与碎片
    trail: [],           // 圆环运动拖尾历史
    spawnAcc: 0,
    blackAcc: 0,
    doubleTimer: 0,     // 双倍得分剩余时间(秒)
    doubleVisual: 0,    // 双倍视觉过渡[0,1]，用于平滑恢复
    colorSpawnCount: 0, // 用于金粒子约 1/10 出现频率
    mouse: { x: 0, y: 0 },
    ring: { x: 0, y: 0 },
    initialized: false,
  };

  let simTime = 0;       // 累计模拟时间（秒），驱动噪声与纹样
  let lastGK = -1, lastCK = -1; // 纹样重绘判据

  // FPS 统计
  let lastFrame = performance.now();
  let fps = 0, fpsSmooth = 0;

  // ---------- 简易 Perlin 噪声（用于自然流场）----------
  const perm = new Uint8Array(512);
  (function () {
    const p = Array.from({ length: 256 }, (_, i) => i);
    for (let i = 255; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      const t = p[i]; p[i] = p[j]; p[j] = t;
    }
    for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  })();
  function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function mixColor(a, b, t) {
    const r = Math.round(a[0] + (b[0] - a[0]) * t);
    const g = Math.round(a[1] + (b[1] - a[1]) * t);
    const bl = Math.round(a[2] + (b[2] - a[2]) * t);
    return "rgb(" + r + "," + g + "," + bl + ")";
  }
  function grad(hash, x, y) {
    const h = hash & 7;
    const u = h < 4 ? x : y;
    const v = h < 4 ? y : x;
    return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
  }
  function noise2(x, y) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    const xf = x - Math.floor(x), yf = y - Math.floor(y);
    const u = fade(xf), v = fade(yf);
    const aa = perm[perm[X] + Y], ab = perm[perm[X] + Y + 1];
    const ba = perm[perm[X + 1] + Y], bb = perm[perm[X + 1] + Y + 1];
    const x1 = lerp(grad(aa, xf, yf), grad(ba, xf - 1, yf), u);
    const x2 = lerp(grad(ab, xf, yf - 1), grad(bb, xf - 1, yf - 1), u);
    return lerp(x1, x2, v); // ≈ [-1, 1]
  }

  // ---------- 声音（Web Audio API 纯合成，无外部文件）----------
  // 关键约束：
  //   - 仅在玩家点击「开始」后创建/恢复 AudioContext（满足自动播放策略）
  //   - 浏览器不支持时静默降级，游戏照常运行
  const Sound = (function () {
    let ctx = null;
    let enabled = true;
    let supported = false;

    function ensureCtx() {
      if (ctx) return ctx;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { supported = false; return null; }
      try {
        ctx = new AC();
        supported = true;
      } catch (e) {
        supported = false;
        ctx = null;
        return null;
      }
      return ctx;
    }

    function resume() {
      const c = ensureCtx();
      if (c && c.state === "suspended" && c.resume) c.resume();
    }

    // 柔和短音：正弦/三角波 + 缓入缓出包络，避免刺耳
    function tone(freq, dur, type, peak, glideTo) {
      const c = ctx;
      if (!enabled || !c) return;
      const t0 = c.currentTime;
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, t0);
      if (glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
      const p = peak == null ? 0.1 : peak;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(p, t0 + 0.012);     // 缓入
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);  // 缓出
      osc.connect(gain).connect(c.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.03);
    }

    return {
      resume: resume,
      setEnabled: function (v) { enabled = !!v; },
      isSupported: function () { return supported; },
      // 收集普通粒子：柔和高音短促上行
      collect: function () { tone(620, 0.13, "sine", 0.09, 880); },
      // 收集金色特殊粒子：更亮的双音上行
      special: function () { tone(740, 0.18, "sine", 0.11, 1180); },
      // 连击升级：短促三角波上行小音
      combo:   function () { tone(880, 0.12, "triangle", 0.08, 1320); },
      // 碰到故障粒子：低频柔和闷响（不刺耳）
      hit:     function () { tone(150, 0.24, "sine", 0.13, 88); },
    };
  })();

  // ---------- 粒子 ----------
  function pickColor() {
    if (Math.random() < 0.12) return GOLD;          // 少量金色
    return PALETTE[(Math.random() * PALETTE.length) | 0];
  }
  function spawnParticle(type) {
    const isBlack = type === "black";
    const isGold = type === "gold";
    const minR = isBlack ? 8 : (isGold ? 8 : 6), maxR = isBlack ? 16 : (isGold ? 16 : 14);
    const r = minR + Math.random() * (maxR - minR);
    const ang = Math.random() * TAU;
    const spd = params.particleSpeed * (isBlack ? 1.4 : 1);
    state.particles.push({
      x: r + Math.random() * (W - 2 * r),
      y: r + Math.random() * (H - 2 * r),
      r: r,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      type: type,
      color: isBlack ? "#0a0a14" : (isGold ? GOLD : pickColor()),
    });
  }

  // ---------- 收集特效（涟漪 + 碎片）----------
  function spawnCollectFX(x, y, color) {
    state.effects.push({
      kind: "ripple", x, y,
      r: params.ringRadius * 0.35,
      maxR: params.ringRadius * 1.9,
      life: 0.6, maxLife: 0.6, color,
    });
    const n = 6;
    for (let k = 0; k < n; k++) {
      const a = Math.random() * TAU;
      const s = 60 + Math.random() * 130;
      state.effects.push({
        kind: "frag", x, y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        r: 1.4 + Math.random() * 2,
        life: 0.45 + Math.random() * 0.35, maxLife: 0.8, color,
      });
    }
  }

  // ---------- 输入 ----------
  function pointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  canvas.addEventListener("mousemove", (e) => {
    const p = pointerPos(e);
    state.mouse.x = p.x; state.mouse.y = p.y;
    if (!state.initialized) { state.ring.x = p.x; state.ring.y = p.y; state.initialized = true; }
  });
  canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();
    const t = e.touches[0];
    const p = pointerPos(t);
    state.mouse.x = p.x; state.mouse.y = p.y;
    if (!state.initialized) { state.ring.x = p.x; state.ring.y = p.y; state.initialized = true; }
  }, { passive: false });

  // ---------- 游戏控制 ----------
  function startGame() {
    Sound.resume();        // 仅在玩家点击开始后创建/恢复 AudioContext
    state.mode = "running";
    state.score = 0;
    state.collisions = 0;
    state.blackHits = 0;
    state.lives = 3;
    state.combo = 0;
    state.comboTimer = 0;
    state.maxCombo = 0;
    state.comboTier = 0;
    state.particles.length = 0;
    state.effects.length = 0;
    state.trail.length = 0;
    state.spawnAcc = 0;
    state.blackAcc = 0;
    state.shake = 0;
    state.flashAlpha = 0;
    state.doubleTimer = 0;
    state.doubleVisual = 0;
    state.colorSpawnCount = 0;
    state.startTime = performance.now();
    state.elapsed = 0;
    state.timeLeft = params.gameDuration;
    state.ring.x = W / 2; state.ring.y = H / 2;
    state.initialized = true;
    lastGK = -1; lastCK = -1;
    hideOverlay();
    updateHUD();
  }

  function endGame() {
    state.mode = "over";
    generatePattern();   // 确保结算页显示本局最终完整纹样
    showEnd();
  }

  // ---------- 更新 ----------
  function update(dt) {
    simTime += dt;

    // 圆环平滑跟随鼠标
    const s = params.ringSmoothing;
    state.ring.x += (state.mouse.x - state.ring.x) * s;
    state.ring.y += (state.mouse.y - state.ring.y) * s;
    state.trail.push({ x: state.ring.x, y: state.ring.y });
    if (state.trail.length > 16) state.trail.shift();

    // 屏幕震动 / 红色闪烁衰减
    state.shake *= 0.85;
    if (state.shake < 0.1) state.shake = 0;
    state.flashAlpha *= 0.85;
    if (state.flashAlpha < 0.01) state.flashAlpha = 0;

    // 特效推进
    for (let i = state.effects.length - 1; i >= 0; i--) {
      const e = state.effects[i];
      e.life -= dt;
      if (e.life <= 0) { state.effects.splice(i, 1); continue; }
      if (e.kind === "ripple") {
        e.r += (e.maxR - e.r) * Math.min(1, dt * 4);
      } else if (e.kind === "frag") {
        e.x += e.vx * dt; e.y += e.vy * dt;
        e.vx *= 0.95; e.vy *= 0.95;
      }
    }

    // 连击窗口衰减
    if (state.comboTimer > 0) {
      state.comboTimer -= dt;
      if (state.comboTimer <= 0) { state.combo = 0; state.comboTier = 0; }
    }

    if (state.mode === "running") {
      state.elapsed = (performance.now() - state.startTime) / 1000;
      state.timeLeft = Math.max(0, params.gameDuration - state.elapsed);

      // 彩色粒子生成
      state.spawnAcc += dt * 1000;
      while (state.spawnAcc >= params.spawnInterval) {
        state.spawnAcc -= params.spawnInterval;
        if (state.particles.length < params.maxParticles) {
          spawnParticle("color");
          state.colorSpawnCount++;
          if (state.colorSpawnCount >= 10) {            // 金粒子约为普通粒子的 1/10
            state.colorSpawnCount = 0;
            let gCount = 0;
            for (const p of state.particles) if (p.type === "gold") gCount++;
            if (gCount < 2) spawnParticle("gold");
          }
        }
      }

      // 黑色故障粒子生成（数量明显少于彩色）
      state.blackAcc += dt * 1000;
      let blackCount = 0;
      for (const p of state.particles) if (p.type === "black") blackCount++;
      while (state.blackAcc >= params.blackSpawnInterval) {
        state.blackAcc -= params.blackSpawnInterval;
        if (blackCount < params.maxBlack) { spawnParticle("black"); blackCount++; }
      }

      // 双倍得分计时 + 视觉平滑过渡（结束时不闪烁，自然淡出）
      if (state.doubleTimer > 0) {
        state.doubleTimer -= dt;
        if (state.doubleTimer < 0) state.doubleTimer = 0;
      }
      const dTarget = state.doubleTimer > 0 ? 1 : 0;
      state.doubleVisual += (dTarget - state.doubleVisual) * Math.min(1, dt * 3);

      // 流场驱动的自然移动 + 环绕边界
      for (const p of state.particles) {
        const ang = noise2(p.x * 0.0022, p.y * 0.0022 + simTime * 0.06) * TAU * 1.7;
        const spd = params.particleSpeed * (p.type === "black" ? 1.4 : 1);
        const dvx = Math.cos(ang) * spd, dvy = Math.sin(ang) * spd;
        p.vx += (dvx - p.vx) * 0.04;
        p.vy += (dvy - p.vy) * 0.04;
        p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.x < -p.r) p.x = W + p.r; else if (p.x > W + p.r) p.x = -p.r;
        if (p.y < -p.r) p.y = H + p.r; else if (p.y > H + p.r) p.y = -p.r;
      }

      // 碰撞检测
      const ringR = params.ringRadius;
      for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        const dx = p.x - state.ring.x;
        const dy = p.y - state.ring.y;
        if (dx * dx + dy * dy < ringR * ringR) {
          state.particles.splice(i, 1);
          if (p.type === "black") {
            // 黑色故障粒子：扣血 + 震动 + 闪红
            state.lives--;
            state.blackHits++;
            state.combo = 0; state.comboTimer = 0; state.comboTier = 0;
            state.shake = 10;
            state.flashAlpha = 0.5;
            Sound.hit();
            if (state.lives <= 0) { endGame(); break; }
          } else {
            // 彩色 / 金色 粒子：得分 + 连击 + 特效
            let gain = params.scorePerParticle;
            if (state.doubleTimer > 0) gain *= 2;   // 双倍得分
            state.score += gain;
            state.collisions++;
            state.combo++;
            if (state.combo > state.maxCombo) state.maxCombo = state.combo;
            state.comboTimer = COMBO_WINDOW;
            spawnCollectFX(p.x, p.y, p.color);
            if (p.type === "gold") {
              state.doubleTimer = params.doubleDuration; // 重置为双倍时长（不叠加）
              Sound.special();
            } else {
              Sound.collect();
            }
            // 连击升级：每 5 连击播放一次升级音（不每层重复）
            const newTier = Math.floor(state.combo / 5);
            if (newTier > state.comboTier) {
              state.comboTier = newTier;
              Sound.combo();
            }
          }
        }
      }

      if (state.timeLeft <= 0) endGame();
    }

    // 纹样按需重绘（随收集量与连击等级变化）
    const gk = Math.floor(Math.min(1, state.collisions / GROW_TARGET) * 24);
    const ck = Math.min(8, Math.floor(state.combo / 3));
    if (gk !== lastGK || ck !== lastCK) { generatePattern(); lastGK = gk; lastCK = ck; }
  }

  // ---------- 12 折对称纹样（离屏生成）----------
  function generatePattern() {
    if (!P) return;
    pctx.clearRect(0, 0, P, P);
    const cx = P / 2, cy = P / 2;
    const g = Math.min(1, state.collisions / GROW_TARGET);
    const cLevel = Math.min(8, Math.floor(state.combo / 3));
    const bright = (0.16 + 0.085 * cLevel) * params.patternBrightness;

    const layers = 2 + Math.floor(g * 5) + Math.min(4, cLevel);
    const rMax = P * 0.46 * (0.28 + 0.72 * g) + P * 0.04;

    for (let i = 0; i < layers; i++) {
      const t = (i + 1) / (layers + 1);
      const r = P * 0.05 + (rMax - P * 0.05) * t;
      const col = PALETTE[i % PALETTE.length];
      const petalSize = P * 0.012 * (0.6 + 0.8 * g) * (1 + 0.12 * cLevel);

      pctx.save();
      pctx.translate(cx, cy);
      pctx.strokeStyle = col;
      pctx.fillStyle = col;
      pctx.lineWidth = 1.1;
      pctx.globalAlpha = bright;
      for (let k = 0; k < 12; k++) {            // 12 折对称
        const ang = k * TAU / 12;
        const px = Math.cos(ang) * r, py = Math.sin(ang) * r;
        pctx.beginPath();
        pctx.arc(px, py, petalSize, 0, TAU);
        pctx.stroke();
        // 辐条
        pctx.globalAlpha = bright * 0.45;
        pctx.beginPath();
        pctx.moveTo(0, 0); pctx.lineTo(px, py);
        pctx.stroke();
        pctx.globalAlpha = bright;
      }
      // 连接环
      pctx.beginPath();
      pctx.arc(0, 0, r, petalSize, TAU - petalSize);
      pctx.stroke();
      pctx.restore();
    }

    // 中心花蕊（始终存在，保证中心不空白）
    pctx.save();
    pctx.translate(cx, cy);
    pctx.globalAlpha = Math.min(1, bright * 1.3);
    pctx.strokeStyle = GOLD;
    pctx.lineWidth = 1.3;
    for (let k = 0; k < 12; k++) {
      const a = k * TAU / 12;
      pctx.beginPath();
      pctx.moveTo(0, 0);
      pctx.lineTo(Math.cos(a) * P * 0.04, Math.sin(a) * P * 0.04);
      pctx.stroke();
    }
    pctx.beginPath();
    pctx.arc(0, 0, P * 0.02, 0, TAU);
    pctx.stroke();
    pctx.restore();
  }

  // ---------- 渲染 ----------
  function render() {
    // 背景
    if (params.showTrails) ctx.fillStyle = "rgba(6,9,18,0.22)";
    else ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // 半透明对称纹样（缓慢自转）
    if (P) {
      ctx.save();
      ctx.globalAlpha = Math.min(0.6, 0.16 + 0.5 * Math.min(1, state.collisions / GROW_TARGET));
      ctx.translate(W / 2, H / 2);
      ctx.rotate(simTime * params.patternSpeed * 0.4);
      ctx.translate(-W / 2, -H / 2);
      ctx.drawImage(patternCanvas, (W - P) / 2, (H - P) / 2);
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    const sx = state.shake > 0 ? (Math.random() * 2 - 1) * state.shake : 0;
    const sy = state.shake > 0 ? (Math.random() * 2 - 1) * state.shake : 0;

    // 粒子
    ctx.save();
    ctx.translate(sx, sy);
    for (const p of state.particles) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, TAU);
      ctx.fillStyle = p.color;
      if (p.type === "black") {
        ctx.shadowBlur = 0;
        ctx.fill();
        ctx.lineWidth = 1.6;
        ctx.strokeStyle = "rgba(220,70,70," + (0.4 + Math.random() * 0.5) + ")";
        ctx.beginPath();
        ctx.arc(p.x + (Math.random() * 2 - 1) * 2, p.y + (Math.random() * 2 - 1) * 2, p.r, 0, TAU);
        ctx.stroke();
      } else {
        ctx.shadowBlur = 12;
        ctx.shadowColor = p.color;
        ctx.fill();
        if (p.type === "gold") {
          // 特殊金色粒子：额外脉动光环，便于辨识
          const pulse = 0.55 + 0.45 * Math.sin(simTime * 6);
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r + 4 + pulse * 3, 0, TAU);
          ctx.strokeStyle = "rgba(230,194,119," + (0.55 * pulse) + ")";
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
      }
    }
    ctx.restore();

    // 收集特效
    ctx.save();
    for (const e of state.effects) {
      const a = Math.max(0, e.life / e.maxLife);
      if (e.kind === "ripple") {
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, TAU);
        ctx.strokeStyle = e.color;
        ctx.globalAlpha = a * 0.5;
        ctx.lineWidth = 2;
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, TAU);
        ctx.fillStyle = e.color;
        ctx.globalAlpha = a;
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // 圆环：运动拖尾 + 柔和光晕
    ctx.save();
    ctx.translate(sx, sy);
    for (let i = 0; i < state.trail.length; i++) {
      const t = i / state.trail.length;
      ctx.beginPath();
      ctx.arc(state.trail[i].x, state.trail[i].y, params.ringRadius * (0.5 + 0.5 * t), 0, TAU);
      ctx.fillStyle = "rgba(120,180,255," + (0.05 * t) + ")";
      ctx.fill();
    }
    const rx = state.ring.x, ry = state.ring.y;
    const dv = state.doubleVisual;
    const coreCol = mixColor([150,200,255], [230,194,119], dv);
    const glowCol = mixColor([90,150,255], [230,194,119], dv);
    const grd = ctx.createRadialGradient(rx, ry, 0, rx, ry, params.ringRadius * 1.6);
    grd.addColorStop(0, "rgba(" + coreCol.slice(4, -1) + ",0.22)");
    grd.addColorStop(0.7, "rgba(" + glowCol.slice(4, -1) + ",0.05)");
    grd.addColorStop(1, "rgba(" + glowCol.slice(4, -1) + ",0)");
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(rx, ry, params.ringRadius * 1.6, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = params.ringGlow * (1 + dv * 0.6);
    ctx.shadowColor = mixColor([127,180,255], [230,194,119], dv);
    ctx.strokeStyle = mixColor([156,196,255], [230,194,119], dv);
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(rx, ry, params.ringRadius, 0, TAU);
    ctx.stroke();
    ctx.restore();

    // 受击红色闪烁（覆盖全屏，不参与震动）
    if (state.flashAlpha > 0.01) {
      ctx.fillStyle = "rgba(220,40,40," + state.flashAlpha + ")";
      ctx.fillRect(0, 0, W, H);
    }

    // 双倍状态柔和金色氛围（随 doubleVisual 平滑淡入淡出，无突兀闪烁）
    if (state.doubleVisual > 0.01) {
      ctx.save();
      ctx.globalAlpha = state.doubleVisual * 0.12;
      const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.18, W / 2, H / 2, Math.max(W, H) * 0.72);
      vg.addColorStop(0, "rgba(230,194,119,0)");
      vg.addColorStop(1, "rgba(230,194,119,1)");
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  }

  // ---------- 主循环 ----------
  function loop(now) {
    const dt = Math.min((now - lastFrame) / 1000, 0.05);
    lastFrame = now;
    const instFps = dt > 0 ? 1 / dt : 0;
    fpsSmooth = fpsSmooth ? fpsSmooth * 0.9 + instFps * 0.1 : instFps;
    fps = Math.round(fpsSmooth);

    update(dt);
    render();
    updateHUD();
    updateDebug();
    requestAnimationFrame(loop);
  }

  // ---------- UI ----------
  const scoreEl = document.getElementById("scoreVal");
  const timeEl = document.getElementById("timeVal");
  const lifeEl = document.getElementById("lifeVal");
  const comboEl = document.getElementById("comboVal");
  const doubStatEl = document.getElementById("doubStat");
  const doubValEl = document.getElementById("doubVal");
  const startBtn = document.getElementById("startBtn");
  const overlay = document.getElementById("overlay");
  const overlayBtn = document.getElementById("overlayBtn");
  const overlayBtnEnd = document.getElementById("overlayBtnEnd");
  const patternPreview = document.getElementById("patternPreview");
  const finalScoreEl = document.getElementById("finalScore");
  const finalComboEl = document.getElementById("finalCombo");
  const finalCollectedEl = document.getElementById("finalCollected");

  function updateHUD() {
    scoreEl.textContent = state.score;
    lifeEl.textContent = state.lives;
    comboEl.textContent = state.combo;
    timeEl.textContent = Math.ceil(state.timeLeft);
    if (state.doubleTimer > 0) {
      doubStatEl.style.display = "block";
      doubValEl.textContent = state.doubleTimer.toFixed(1);
    } else {
      doubStatEl.style.display = "none";
    }
    startBtn.disabled = state.mode === "running";
    startBtn.textContent = state.mode === "running" ? "进行中…" : "开始游戏";
  }

  function showStart() {
    overlay.querySelector(".ov-start").style.display = "flex";
    overlay.querySelector(".ov-end").style.display = "none";
    overlay.classList.remove("hidden");
  }
  function showEnd() {
    finalScoreEl.textContent = state.score;
    finalComboEl.textContent = state.maxCombo;
    finalCollectedEl.textContent = state.collisions;
    drawPatternPreview();
    overlay.querySelector(".ov-start").style.display = "none";
    overlay.querySelector(".ov-end").style.display = "flex";
    overlay.classList.remove("hidden");
  }
  function hideOverlay() { overlay.classList.add("hidden"); }

  // 把本局最终纹样绘制到结算页的圆形预览画布
  function drawPatternPreview() {
    const d = patternPreview;
    const c = d.getContext("2d");
    c.clearRect(0, 0, d.width, d.height);
    if (!P) return;
    c.save();
    c.translate(d.width / 2, d.height / 2);
    c.drawImage(patternCanvas, -d.width / 2, -d.height / 2, d.width, d.height);
    c.globalAlpha = 0.5;   // 叠加一次提升可读性，不失真
    c.drawImage(patternCanvas, -d.width / 2, -d.height / 2, d.width, d.height);
    c.restore();
    c.globalAlpha = 1;
  }

  startBtn.addEventListener("click", () => { if (state.mode !== "running") startGame(); });
  overlayBtn.addEventListener("click", startGame);
  overlayBtnEnd.addEventListener("click", startGame);

  // 调试信息
  const debugEl = document.getElementById("debug");
  const debugRows = [
    ["状态", "mode"],
    ["FPS", "fps"],
    ["粒子数", "pc"],
    ["碰撞数", "col"],
    ["连击", "cb"],
    ["纹样级", "cl"],
    ["纹样增长%", "gw"],
    ["生命", "lv"],
    ["黑粒子", "bk"],
    ["金粒子", "gd"],
    ["圆环X", "rx"],
    ["圆环Y", "ry"],
    ["鼠标X", "mx"],
    ["鼠标Y", "my"],
    ["剩余(s)", "tl"],
  ];
  debugEl.innerHTML = debugRows.map(r => `<div class="row"><span>${r[0]}</span><span id="d_${r[1]}">-</span></div>`).join("");

  function updateDebug() {
    document.getElementById("d_mode").textContent = state.mode;
    document.getElementById("d_fps").textContent = fps;
    document.getElementById("d_pc").textContent = state.particles.length;
    document.getElementById("d_col").textContent = state.collisions;
    document.getElementById("d_cb").textContent = state.combo;
    document.getElementById("d_cl").textContent = Math.min(8, Math.floor(state.combo / 3));
    document.getElementById("d_gw").textContent = Math.round(Math.min(1, state.collisions / GROW_TARGET) * 100);
    document.getElementById("d_lv").textContent = state.lives;
    let dbgBlack = 0;
    for (const p of state.particles) if (p.type === "black") dbgBlack++;
    document.getElementById("d_bk").textContent = dbgBlack;
    let dbgGold = 0;
    for (const p of state.particles) if (p.type === "gold") dbgGold++;
    document.getElementById("d_gd").textContent = dbgGold;
    document.getElementById("d_rx").textContent = Math.round(state.ring.x);
    document.getElementById("d_ry").textContent = Math.round(state.ring.y);
    document.getElementById("d_mx").textContent = Math.round(state.mouse.x);
    document.getElementById("d_my").textContent = Math.round(state.mouse.y);
    document.getElementById("d_tl").textContent = state.timeLeft.toFixed(1);
  }

  // 参数面板生成
  const controlsEl = document.getElementById("controls");
  sliderConfig.forEach(cfg => {
    const wrapDiv = document.createElement("div");
    wrapDiv.className = "ctrl";
    wrapDiv.innerHTML =
      '<label>' + cfg.label + '<span class="val" id="v_' + cfg.key + '"></span></label>' +
      '<input type="range" min="' + cfg.min + '" max="' + cfg.max + '" step="' + cfg.step + '" id="s_' + cfg.key + '">';
    controlsEl.appendChild(wrapDiv);
    const slider = wrapDiv.querySelector("input");
    const valSpan = wrapDiv.querySelector(".val");
    slider.value = params[cfg.key];
    valSpan.textContent = params[cfg.key];
    slider.addEventListener("input", () => {
      const v = Number(slider.value);
      params[cfg.key] = v;
      valSpan.textContent = v;
    });
  });
  // 拖影开关
  const trailWrap = document.createElement("div");
  trailWrap.className = "ctrl checkbox";
  trailWrap.innerHTML = '<label><input type="checkbox" id="c_trails"> 开启整体拖影</label>';
  controlsEl.appendChild(trailWrap);
  trailWrap.querySelector("input").addEventListener("change", (e) => {
    params.showTrails = e.target.checked;
  });
  // 声音开关（默认开启）
  const soundWrap = document.createElement("div");
  soundWrap.className = "ctrl checkbox";
  soundWrap.innerHTML = '<label><input type="checkbox" id="c_sound" checked> 开启声音</label>';
  controlsEl.appendChild(soundWrap);
  soundWrap.querySelector("input").addEventListener("change", (e) => {
    Sound.setEnabled(e.target.checked);
  });

  // ---------- 启动 ----------
  resize();
  state.ring.x = W / 2; state.ring.y = H / 2;
  state.mouse.x = W / 2; state.mouse.y = H / 2;
  showStart();
  updateHUD();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
