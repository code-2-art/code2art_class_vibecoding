<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鼠标流光 · 第一课示例</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080f1c;color:#dce9f6;font:14px system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh;touch-action:none}header{position:fixed;top:36px;left:36px;pointer-events:none}small{color:#7ca9c4;letter-spacing:3px}h1{font-size:32px;font-weight:500;margin:12px 0}p{color:#8eacc4}aside{position:fixed;right:28px;top:36px;width:220px;padding:22px;background:#102034ee;border:1px solid #284059;border-radius:12px}label{display:block;margin:22px 0 8px}input{width:100%;accent-color:#71d5df}output{float:right;color:#8edfe5}button{background:#203d51;color:#def9ff;border:1px solid #476375;border-radius:6px;padding:9px;width:100%;margin-top:22px;cursor:pointer}#fps{display:block;color:#8eacc4;margin-top:16px}#error{position:fixed;bottom:20px;left:20px;color:#ffc2c2}@media(max-width:650px){header{top:20px;left:20px}h1{font-size:24px}aside{top:auto;bottom:16px;right:16px;width:190px;padding:14px}label{margin-top:10px}}</style>
<canvas id="canvas" aria-label="移动鼠标或拖动手指，使圆环跟随并形成轨迹"></canvas>
<header><small>CODE2ART / LESSON 01</small><h1>鼠标流光</h1><p>移动鼠标，或在画面上拖动手指。</p></header>
<aside><strong>交互参数</strong><label for="radius">圆环半径 <output id="rv">22</output></label><input id="radius" type="range" min="6" max="60" value="22"><label for="speed">跟随速度 <output id="sv">8</output></label><input id="speed" type="range" min="2" max="20" value="8"><button id="clear">清空轨迹</button><span id="fps">FPS —</span></aside>
<p id="error" role="alert"></p><noscript>请启用 JavaScript 以运行本作品。</noscript>
<script>
(()=>{'use strict';const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),error=document.getElementById('error');if(!ctx){error.textContent='此浏览器不支持 Canvas 2D，请更换浏览器。';return;}if(!window.requestAnimationFrame){error.textContent='此浏览器不支持动画帧，请更换浏览器。';return;}const radius=document.getElementById('radius'),speed=document.getElementById('speed');let w,h,x,y,tx,ty,points=[],last=0,count=0,fpsStart=0;function resize(){w=innerWidth;h=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);x=tx=w*.45;y=ty=h*.55;points=[];}resize();addEventListener('resize',resize);canvas.addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY;});canvas.addEventListener('pointerdown',e=>{tx=e.clientX;ty=e.clientY;canvas.setPointerCapture(e.pointerId);});radius.oninput=()=>document.getElementById('rv').textContent=radius.value;speed.oninput=()=>document.getElementById('sv').textContent=speed.value;document.getElementById('clear').onclick=()=>{points=[];};function frame(t){const dt=last?Math.min((t-last)/1000,.05):.016;last=t;const a=1-Math.exp(-Number(speed.value)*dt);x+=(tx-x)*a;y+=(ty-y)*a;points.push({x,y,t});points=points.filter(p=>t-p.t<900);ctx.clearRect(0,0,w,h);for(let i=0;i<points.length;i++){const p=points[i],alpha=(1-(t-p.t)/900)*.42;ctx.beginPath();ctx.arc(p.x,p.y,Number(radius.value)*(0.25+alpha),0,Math.PI*2);ctx.strokeStyle=`rgba(104,191,239,${alpha})`;ctx.lineWidth=1;ctx.stroke();}ctx.shadowBlur=22;ctx.shadowColor='#72e1ed';ctx.strokeStyle='#9cf2ef';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,Number(radius.value),0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;count++;if(t-fpsStart>700){document.getElementById('fps').textContent='FPS '+Math.round(count*1000/(t-fpsStart));count=0;fpsStart=t;}requestAnimationFrame(frame);}requestAnimationFrame(frame);})();
</script></html>
